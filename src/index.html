<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPLIT — Who owes what</title>
  <meta name="description" content="A simple, self-hosted expense splitter. Enter who paid what and instantly see who owes whom.">

  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPLIT">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">

  <!-- Apply theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="SPLIT home">
        <img class="brand-logo" src="icon.svg" alt="" width="38" height="38">
        <span class="brand-name">SPLIT</span>
      </a>

      <div class="controls">
        <div class="segmented" role="group" aria-label="Language">
          <button class="seg" type="button" data-lang="en">EN</button>
          <button class="seg" type="button" data-lang="es">ES</button>
          <button class="seg" type="button" data-lang="ca">CA</button>
        </div>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="intro">
        <h1 id="title">What do I owe you?</h1>
        <p class="subtitle" id="subtitle">Enter who paid what and see who owes whom.</p>
      </div>

      <section class="card">
        <form id="debt-form" novalidate>
          <div class="people" id="content"></div>
          <button class="add-btn" id="add" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span id="add-label">Add person</span>
          </button>
        </form>

        <p class="form-error hidden" id="form-error" role="alert"></p>

        <div class="card-actions">
          <button class="btn btn-ghost" id="reset" type="button">Reset</button>
          <button class="btn btn-primary" id="submit" type="button">Calculate</button>
        </div>
      </section>

      <section id="summary" class="summary hidden" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <a href="https://github.com/polius/SPLIT" target="_blank" rel="noopener noreferrer" class="github-link">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span>GitHub</span>
      </a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span class="footer-version" id="version">v2.0.0</span>
    </footer>
  </div>

  <!-- Generated at container start from CURRENCY / CURRENCY_POSITION env vars. -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
